name: Update research metrics

on:
  schedule:
    - cron: "0 9 * * *" # every day at 09:00 UTC (06:00 in Brasília)
  workflow_dispatch:

permissions:
  contents: write # commit _data/metrics.json
  actions: write # trigger the deploy workflow

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
      - name: Collect metrics 📊
        env:
          SCOPUS_API_KEY: ${{ secrets.SCOPUS_API_KEY }}
          SCOPUS_INSTTOKEN: ${{ secrets.SCOPUS_INSTTOKEN }}
          WOS_API_KEY: ${{ secrets.WOS_API_KEY }}
        run: python3 bin/update_metrics.py
      - name: Commit if changed 💾
        id: commit
        run: |
          if git diff --quiet _data/metrics.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add _data/metrics.json
            git commit -m "Update research metrics"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # Pushes made with GITHUB_TOKEN don't trigger other workflows,
      # but workflow_dispatch does, so the deploy is started explicitly.
      - name: Deploy site 🚀
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref ${{ github.ref_name }}
